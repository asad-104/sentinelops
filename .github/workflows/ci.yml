# Lint and the fast test subset on every push to main and every pull request. No secrets, read-only token.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-viewer.txt
            requirements-dev.txt

      - name: Install (core, viewer and dev pins)
        run: python -m pip install -r requirements.txt -r requirements-viewer.txt -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Generate the dev split and check it against its frozen manifest
        run: |
          python -m sentinelops.simulator --split dev
          python -c "from pathlib import Path; from sentinelops.evaluation.harness import verify_split; from sentinelops.simulator.profiles import Split; verify_split(Split.DEV, Path('data/dev')); print('dev split matches its frozen manifest')"

      - name: Fast tests (the full suite is the local gate)
        run: python -m pytest -m "not slow"
